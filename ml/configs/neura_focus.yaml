model:
  name: "neura-focus-distilbert-v1"
  base_checkpoint: "distilbert/distilbert-base-multilingual-cased"
  license: "Apache-2.0"
  num_labels: 4
  labels: ["focused", "tired", "stressed", "ok"]

dataset:
  source: "go_emotions_multilingual"
  license: "Apache-2.0"

safety_protocol:
  crisis_keywords_trigger: true
  helpline_name: "Tele-MANAS"
  helpline_number: "14416"
  helpline_toll_free: "1800-891-4416"
  halt_gamification: true
  store_raw_text: false

training:
  epochs: 3
  batch_size: 16
  learning_rate: 3.0e-5
