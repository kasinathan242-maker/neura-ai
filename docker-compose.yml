# Self-hosted NEURA AI. Open http://localhost:8080
#
# `docker compose up --build`
#
# The backend reaches an Ollama running on the host machine, so this gives real
# model answers with no API key. To use a cloud provider instead, set LLM_API_KEY
# in a .env file next to this one (see .env.example).

services:
  backend:
    build: ./backend
    environment:
      # host.docker.internal resolves to the host from inside the container.
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-llava}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      KV_REST_API_URL: ${KV_REST_API_URL:-}
      KV_REST_API_TOKEN: ${KV_REST_API_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # Not published: nginx proxies /api to it on the compose network, so the API
    # is not separately exposed. Add `ports: ["8001:8001"]` to reach it directly.

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
